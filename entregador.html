<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07108D">
<title>Ideal Gás — Entregador</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
:root{
  --blue:#07108D;--blue2:#111BB8;--green:#27E33C;--bg:#F3F5FA;--card:#fff;--ink:#111426;--muted:#747B91;--line:#E6E9F2;
}
*{box-sizing:border-box}body{margin:0;background:#E9EDF5;font-family:Manrope,Arial,sans-serif;color:var(--ink)}
.app{width:min(100%,520px);min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 60px rgba(7,16,141,.12)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#050A59,var(--blue));color:#fff;padding:14px 16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:"Plus Jakarta Sans",sans-serif;font-size:22px;font-weight:800}.delivery-brand{display:block;height:38px;max-width:220px;width:auto;object-fit:contain;object-position:left center}
.sub{font-size:10px;color:#DDE1FB;margin-top:2px}
.status{font-size:9px;padding:6px 9px;border-radius:999px;background:rgba(39,227,60,.16);color:#7BFF8C;font-weight:800}
main{padding:14px 14px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(7,16,141,.07)}
h2{font-size:18px;color:var(--blue);margin:0 0 10px;font-family:"Plus Jakarta Sans",sans-serif}
label{display:block;font-size:10px;font-weight:800;color:#353C50;margin-bottom:6px}
select,input{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;padding:0 12px;background:#FAFBFE;color:var(--ink)}
.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:800;font-size:11px;cursor:pointer}
.btn-green{background:linear-gradient(135deg,var(--green),#18C52B);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-gray{background:#EEF1F7;color:var(--blue)}
.orders{display:grid;gap:10px}
.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}
.order-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.order strong{color:var(--blue);font-size:13px}
.badge{font-size:8.5px;font-weight:800;border-radius:999px;padding:5px 8px;background:#EEF1FF;color:var(--blue)}
.meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions .btn{flex:1}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:11px}
.counter{font-size:28px;font-weight:900;color:var(--blue)}
.counter small{font-size:10px;font-weight:700;color:var(--muted)}
.info-row{display:flex;justify-content:space-between;gap:8px;align-items:center}

.login-card{
  margin-top:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  box-shadow:0 10px 28px rgba(7,16,141,.08);
}
.login-card h2{margin-bottom:5px}
.login-card p{font-size:10px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.pin-input{
  text-align:center;
  font-size:22px;
  font-weight:900;
  letter-spacing:10px;
}
.login-actions{display:flex;gap:8px;margin-top:12px}
.login-actions .btn{flex:1}
.logout-btn{
  background:rgba(255,255,255,.10);
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  padding:7px 10px;
  border-radius:10px;
  font-size:9px;
  font-weight:800;
}
.hidden{display:none!important}
.driver-identity{
  font-size:10px;color:#DDE1FB;margin-top:2px
}


.btn.delivery-loading{position:relative;pointer-events:none;opacity:.8;padding-right:34px}
.btn.delivery-loading::after{
  content:"";position:absolute;right:11px;top:50%;width:13px;height:13px;margin-top:-7px;
  border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;
  animation:deliverySpin .65s linear infinite
}
@keyframes deliverySpin{to{transform:rotate(360deg)}}
.delivery-toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);
  z-index:5000;background:#101828;color:#fff;padding:11px 14px;border-radius:12px;
  font-size:10.5px;font-weight:800;opacity:0;transition:.2s ease;max-width:calc(100vw - 24px)
}
.delivery-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.delivery-toast.ok{background:#168E26}.delivery-toast.error{background:#B42318}
</style>
</head>

<script>
window.IDEAL_GAS_SHEETS_URL = window.IDEAL_GAS_SHEETS_URL || 'https://script.google.com/macros/s/AKfycbwcmjYbMjEuDK8rv-j3AE7iewOspmtktxw4EfbWRs7BX3tnHIwM1C7LFpGBoBnBA8-Scw/exec';
</script>

<script>
const ORDER_KEY='ideal_orders';

const SHEETS_API_URL=(window.IDEAL_GAS_SHEETS_URL||'').trim();

async function sheetsApi(action,data={}){
  if(!SHEETS_API_URL || SHEETS_API_URL.includes('COLE_AQUI')) throw new Error('URL do Google Apps Script não configurada.');
  let response;
  try{
    response=await fetch(SHEETS_API_URL,{
      method:'POST',
      redirect:'follow',
      cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,...data})
    });
  }catch(e){
    throw new Error('Não foi possível conectar ao Google Apps Script. Verifique a implantação do Web App.');
  }
  const raw=await response.text();
  let result;
  try{ result=JSON.parse(raw); }
  catch(e){
    if(/<!doctype|<html|accounts\.google|script\.google/i.test(raw||'')){
      throw new Error('O Google Apps Script respondeu uma página em vez de JSON. Atualize o Code.gs da V88 e publique uma NOVA VERSÃO com acesso para "Qualquer pessoa".');
    }
    throw new Error('Resposta inválida do Google Apps Script. Atualize a implantação do backend.');
  }
  if(!result.ok)throw new Error(result.error||'Erro ao acessar o Google Sheets.');
  return result;
}

function applyRemoteState(state={}){
  window.__idealApplyingRemote=true;
  try{
    Object.entries(state||{}).forEach(([key,value])=>{
      localStorage.setItem(key,typeof value==='string'?value:JSON.stringify(value));
    });
  }finally{
    window.__idealApplyingRemote=false;
  }
}
const DRIVER_KEY='ideal_drivers';


const DRIVER_SESSION_KEY='ideal_driver_session';
const DRIVER_TOKEN_KEY='ideal_driver_backend_token';
const PRODUCT_CATALOG_KEY='ideal_product_catalog';
const STOCK_LEDGER_KEY='ideal_stock_delivery_ledger_v72';
const MAX_DELIVERIES=10;


function getProductCatalog(){
  try{return JSON.parse(localStorage.getItem(PRODUCT_CATALOG_KEY)||'{}')}catch(e){return {}}
}

function deductDeliveredOrderStock(order){
  let ledger={};
  try{ledger=JSON.parse(localStorage.getItem(STOCK_LEDGER_KEY)||'{}')}catch(e){ledger={}}

  const key=String(order.id);
  if(ledger[key])return;

  const movement={p13:0,water:0,kit:0,support:0,custom:{},orderId:order.id,deliveredAt:new Date().toISOString()};
  const qty=Math.max(1,Number(order.qty||1));

  if(order.type==='water')movement.water=qty;
  else movement.p13=qty;

  if(order.accessories?.kit)movement.kit=1;
  if(order.accessories?.support)movement.support=1;

  (order.customProducts||[]).forEach(item=>{
    const k=String(item.id ?? item.name ?? '');
    if(k)movement.custom[k]=(movement.custom[k]||0)+Math.max(1,Number(item.qty||1));
  });

  ledger[key]=movement;
  order.stockDeducted=true;

  localStorage.setItem(STOCK_LEDGER_KEY,JSON.stringify(ledger));
  localStorage.setItem('ideal_catalog_sync_v48',String(Date.now()));
}

function getOrders(){try{return JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')}catch(e){return []}}
function getDrivers(){try{return JSON.parse(localStorage.getItem(DRIVER_KEY)||'[]')}catch(e){return []}}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function normalizeStatus(s){const map={'Novo':'Pedido recebido','Aceito':'Confirmado','Em rota':'Saiu para entrega'};return map[s]||s||'Pedido recebido'}

function getSession(){
  try{return JSON.parse(sessionStorage.getItem(DRIVER_SESSION_KEY)||'null')}catch(e){return null}
}

function setSession(driver){
  sessionStorage.setItem(DRIVER_SESSION_KEY,JSON.stringify({
    id:driver.id,
    name:driver.name,
    loginAt:new Date().toISOString()
  }));
}

function clearSession(){
  sessionStorage.removeItem(DRIVER_SESSION_KEY);
}

function getLoggedDriver(){
  const s=getSession();
  if(!s)return null;
  return getDrivers().find(d=>String(d.id)===String(s.id))||null;
}

async function renderLoginDrivers(){
  const sel=document.getElementById('loginDriverSelect');
  try{
    const result=await sheetsApi('publicDrivers');
    const drivers=result.drivers||[];
    localStorage.setItem(DRIVER_KEY,JSON.stringify(drivers));
    if(!drivers.length){sel.innerHTML='<option value="">Nenhum entregador cadastrado</option>';return}
    sel.innerHTML='<option value="">Selecione seu nome...</option>'+drivers.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
  }catch(e){
    sel.innerHTML='<option value="">Backend indisponível</option>';
    console.warn(e.message);
    const login=document.getElementById('driverLogin');
    if(login && !document.getElementById('driverBackendWarning')){
      login.insertAdjacentHTML('beforeend','<div id="driverBackendWarning" style="margin-top:10px;padding:10px;border-radius:11px;background:#FDEBEC;color:#B42318;font-size:10px;font-weight:800">Atualize o Code.gs e publique a implantação da V88.</div>');
    }
  }
}

async function loginDriver(){
  const id=document.getElementById('loginDriverSelect')?.value||'';
  const pin=(document.getElementById('driverPin')?.value||'').replace(/\D/g,'');

  if(!id){alert('Selecione seu nome.');return}
  if(!pin){alert('Digite seu PIN.');return}

  try{
    const result=await sheetsApi('driverLogin',{driverId:id,pin});

    sessionStorage.setItem(DRIVER_TOKEN_KEY,result.token);
    setSession(result.driver);
    document.getElementById('driverPin').value='';
    renderApp();
  }catch(e){
    alert(e.message==='PIN incorreto.'?'PIN incorreto.':'Não foi possível entrar: '+e.message);
    document.getElementById('driverPin').value='';
  }
}

function logoutDriver(){
  clearSession();
  sessionStorage.removeItem(DRIVER_TOKEN_KEY);
  renderApp();
}


async function validateBackendSession(){
  const token=sessionStorage.getItem(DRIVER_TOKEN_KEY);
  if(!token)return null;
  try{
    const result=await sheetsApi('driverSession',{token});
    return result.driver||null;
  }catch(e){
    clearSession();
    sessionStorage.removeItem(DRIVER_TOKEN_KEY);
    return null;
  }
}

async function refreshDriverOrders(){
  const token=sessionStorage.getItem(DRIVER_TOKEN_KEY);
  if(!token)return;
  try{
    const result=await sheetsApi('driverOrders',{token});
    window.__idealApplyingRemote=true;
    try{
      localStorage.setItem(ORDER_KEY,JSON.stringify(result.orders||[]));
      if(result.ledger)localStorage.setItem(STOCK_LEDGER_KEY,JSON.stringify(result.ledger));
    }finally{window.__idealApplyingRemote=false}
    const d=result.driver;
    if(d){
      localStorage.setItem(DRIVER_KEY,JSON.stringify([d]));
      setSession(d);
    }
    renderApp();
  }catch(e){console.warn(e.message)}
}

function assignedOrders(driverId){
  return getOrders().filter(o=>{
    const status=normalizeStatus(o.status);
    return o.driver && String(o.driver.id)===String(driverId) && status!=='Entregue' && status!=='Cancelado';
  });
}

async function renderApp(){
  let driver=getLoggedDriver();
  if(driver && sessionStorage.getItem(DRIVER_TOKEN_KEY)){
    const validated=await validateBackendSession();
    driver=validated||null;
  }else if(driver){
    driver=null;
    clearSession();
  }
  const login=document.getElementById('driverLogin');
  const privateArea=document.getElementById('driverPrivateArea');
  const logout=document.getElementById('logoutBtn');
  const name=document.getElementById('loggedDriverName');

  if(!driver){
    login.classList.remove('hidden');
    privateArea.classList.add('hidden');
    logout.classList.add('hidden');
    name.textContent='';
    renderLoginDrivers();
    return;
  }

  login.classList.add('hidden');
  privateArea.classList.remove('hidden');
  logout.classList.remove('hidden');
  name.textContent='Entregador: '+driver.name;

  renderDriverArea(driver);
}

function renderDriverArea(driver){
  const orders=assignedOrders(driver.id);
  document.getElementById('assignedCount').textContent=orders.length;
  document.getElementById('driverAvailability').textContent=orders.length>=MAX_DELIVERIES?'Ocupado':'Disponível';

  const wrap=document.getElementById('driverOrders');

  if(!orders.length){
    wrap.innerHTML='<div class="card empty">Nenhuma entrega atribuída no momento.</div>';
    return;
  }

  wrap.innerHTML=orders.map(o=>{
    const status=normalizeStatus(o.status);
    const mapBtn=o.location?.mapsUrl
      ? `<button class="btn btn-gray" onclick="window.open('${o.location.mapsUrl}','_blank')">ABRIR MAPA</button>`
      : '';

    return `<div class="order">
      <div class="order-top">
        <div>
          <strong>Pedido #${o.id} — ${o.name||'Cliente'}</strong>
          <div class="meta">${o.address||'Endereço não informado'}</div>
        </div>
        <span class="badge">${status}</span>
      </div>

      <div class="meta">${o.qty||1} × ${o.type==='water'?(o.productName||'Água Mineral 20L'):'Botijão P13'} • ${money(o.total)}</div>
      ${o.phone?`<div class="meta">📞 ${o.phone}</div>`:''}
      ${o.obs?`<div class="meta">Obs.: ${o.obs}</div>`:''}

      <div class="actions">
        ${mapBtn}
        ${status==='Confirmado'?`<button class="btn btn-blue" onclick="setDeliveryStatus(${o.id},'Saiu para entrega',this)">SAIR PARA ENTREGA</button>`:''}
        ${status==='Saiu para entrega'?`<button class="btn btn-green" onclick="setDeliveryStatus(${o.id},'Entregue',this)">MARCAR COMO ENTREGUE</button>`:''}
      </div>
    </div>`;
  }).join('');
}


function showDeliveryToast(message,type=''){
  const el=document.getElementById('deliveryToast');
  if(!el)return;
  el.textContent=message;
  el.className='delivery-toast show '+type;
  clearTimeout(window.__deliveryToastTimer);
  window.__deliveryToastTimer=setTimeout(()=>el.className='delivery-toast',2600);
}

function setDeliveryButtonLoading(btn,loading,text){
  if(!btn)return;
  if(loading){
    if(!btn.dataset.originalText)btn.dataset.originalText=btn.textContent;
    btn.disabled=true;btn.classList.add('delivery-loading');
    if(text)btn.textContent=text;
  }else{
    btn.disabled=false;btn.classList.remove('delivery-loading');
    if(btn.dataset.originalText)btn.textContent=btn.dataset.originalText;
  }
}

async function setDeliveryStatus(id,status,btn=null){
  const token=sessionStorage.getItem(DRIVER_TOKEN_KEY);
  if(!token){
    showDeliveryToast('Sua sessão expirou. Entre novamente.','error');
    logoutDriver();
    return;
  }

  const working=status==='Entregue'?'FINALIZANDO...':'ATUALIZANDO...';
  setDeliveryButtonLoading(btn,true,working);

  try{
    // Valida primeiro a sessão para evitar botão "morto" quando o token expirou.
    const driver=await validateBackendSession();
    if(!driver)throw new Error('Sessão expirada. Entre novamente.');

    const result=await sheetsApi('driverUpdateStatus',{token,orderId:id,status});
    if(!result || !result.order)throw new Error('O servidor não confirmou a atualização.');

    // Atualiza localmente na hora para resposta visual imediata.
    const localOrders=getOrders();
    const local=localOrders.find(o=>Number(o.id)===Number(id));
    if(local){
      local.status=status;
      local.updatedAt=new Date().toISOString();
      localStorage.setItem(ORDER_KEY,JSON.stringify(localOrders));
    }

    showDeliveryToast(status==='Entregue'?'Entrega finalizada com sucesso.':'Status atualizado.','ok');
    await refreshDriverOrders();
  }catch(e){
    showDeliveryToast('Não foi possível atualizar: '+String(e?.message||e),'error');
    if(/sessão/i.test(String(e?.message||'')))logoutDriver();
  }finally{
    setDeliveryButtonLoading(btn,false);
  }
}

window.addEventListener('storage',e=>{
  if([ORDER_KEY,DRIVER_KEY].includes(e.key)){
    const driver=getLoggedDriver();
    if(!driver && getSession())clearSession();
    renderApp();
  }
});

try{
  const ch=new BroadcastChannel('ideal_orders_channel');
  ch.onmessage=()=>renderApp();
}catch(e){}

document.addEventListener('input',e=>{
  if(e.target?.id==='driverPin'){
    e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
  }
});

renderApp();
renderLoginDrivers();
setInterval(()=>{if(sessionStorage.getItem(DRIVER_TOKEN_KEY))refreshDriverOrders()},6000);
</script>
<div class="delivery-toast" id="deliveryToast"></div>
